<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monster Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="min-h-screen py-10 px-4">
    <div id="app" class="max-w-6xl mx-auto">
      <!-- En-tête marquee -->
      <header class="text-center mb-10">
        <p class="text-[var(--silver)] tracking-widest text-sm">A creature feature archive</p>
        <h1 class="marquee text-6xl md:text-8xl my-3">Monster Archive</h1>
        <p class="text-[var(--silver)] italic">
          They rose from the deep between 1950 and 1969. Someone had to keep the records.
        </p>
      </header>

      <main class="flex flex-col md:flex-row gap-8">
        <!-- Aside gauche pour le formulaire -->
        <aside class="deco-frame md:w-1/3 p-6 bg-[var(--murk)]/60 self-start">
          <h2 class="display text-2xl mb-5 text-[var(--pearl)]">File a new creature</h2>

          <label class="block mb-4 text-[var(--silver)]">
            Name
            <input type="text" id="monster-name" class="field" placeholder="The Crawling Mass" />
          </label>

          <label class="block mb-4 text-[var(--silver)]">
            Type
            <select id="monster-type" class="field">
              <option>Giant reptile</option>
              <option>Alien</option>
              <option>Mutant</option>
              <option>Giant insect</option>
              <option>Robot</option>
              <option>Deep-sea creature</option>
            </select>
          </label>

          <label class="block mb-4 text-[var(--silver)]">
            Danger level (1 to 5)
            <input type="number" id="monster-danger" min="1" max="5" class="field" placeholder="3" />
          </label>

          <label class="block mb-6 text-[var(--silver)]">
            Release year
            <input type="number" id="monster-year" min="1950" max="1969" class="field" placeholder="1957" />
          </label>

          <button class="btn btn-lipstick w-full py-3 px-4 text-lg">Add to the archive</button>
        </aside>

        <!-- Section droite pour la liste des créatures -->
        <section class="deco-frame md:w-2/3 p-6 bg-[var(--murk)]/40">
          <div class="flex flex-wrap justify-between items-baseline gap-2 mb-5">
            <h2 class="display text-2xl">The archive</h2>
            <p class="text-[var(--silver)]">
              Creatures on file :
              <span class="display text-2xl text-[var(--gold)]" id="monsters-count">0</span>
            </p>
          </div>

          <!-- Filtre de recherche -->
          <input type="search" id="search-monsters" class="field mb-5" placeholder="Search by name or type" />

          <!-- Liste des créatures triée et filtrée -->
          <div class="overflow-x-auto">
            <table class="monsters-table w-full">
              <thead>
                <tr>
                  <th class="text-left p-3"><a href="#">Name</a></th>
                  <th class="text-left p-3"><a href="#">Type</a></th>
                  <th class="text-left p-3"><a href="#">Danger</a></th>
                  <th class="text-left p-3"><a href="#">Year</a></th>
                  <th class="text-right p-3">Actions</th>
                </tr>
              </thead>
            <tbody id="monsters-container">
            </tbody>
            </table>
          </div>
        </section>
      </main>

      <footer class="text-center text-[var(--silver)] text-sm mt-10 italic">
        &copy; EAFC 2026 Monster Archive. No creature was harmed during development.
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
